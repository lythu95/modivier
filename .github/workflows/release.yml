name: Release

# 手动触发：仅执行三平台编译（用于验证流程，不发布）
# 推送 v* 标签：编译 + 发布 GitHub Release + 同步 Gitee Release
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS 通用二进制（Intel + Apple Silicon 一个安装包）
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-name: macos-dmg
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # Linux：deb + rpm（在 22.04 上编译，兼容较老的 glibc）
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            artifact-name: linux-packages
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          # Windows：NSIS 安装包
          - platform: windows-latest
            args: ''
            rust-targets: ''
            artifact-name: windows-packages
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              bundles/*.exe
    runs-on: ${{ matrix.settings.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build -- ${{ matrix.settings.args }}

      - name: Stage portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundles | Out-Null
          $version = "${{ github.ref_name }}" -replace '^v',''
          Copy-Item "src-tauri/target/release/modivier.exe" ("bundles/MoDiViEr_{0}_x64_portable.exe" -f $version)

      - name: List bundle outputs
        if: runner.os == 'Linux'
        run: ls -laR src-tauri/target/release/bundle/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.settings.artifact-name }}
          path: ${{ matrix.settings.artifact-path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_GITEE_TOKEN: ${{ secrets.GITEE_TOKEN != '' }}
    steps:
      - name: Checkout (need tag object for pushing to Gitee)
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # upload-artifact 会按公共祖先目录保留层级（如 dist/deb/、dist/rpm/），
      # 先摊平到 dist/ 根目录，方便 asset-files 用 dist/*.deb 等通配
      - name: Flatten and list release assets
        run: |
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -type d -empty -delete
          ls -la dist/

      # GitHub 侧用 softprops（按 tag 复用/更新 Release，重跑幂等）；
      # release-sync 的 GitHub 路径对已存在的 Release 会报 422，只保留其 Gitee 同步
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MoDiViEr ${{ github.ref_name }}'
          body: |
            **MoDiViEr —— MarkDown Viewer and Editor**

            | 平台 | 安装包 |
            | --- | --- |
            | Windows | `MoDiViEr_*_x64-setup.exe`（安装包）/ `MoDiViEr_*_x64_portable.exe`（便携单文件，免安装） |
            | macOS | `MoDiViEr_*.dmg`（Intel / Apple Silicon 通用） |
            | Linux | `MoDiViEr_*.deb`（Debian/Ubuntu）、`MoDiViEr-*.rpm`（Fedora/openSUSE） |

            > macOS 安装包未签名，首次打开需右键 → 打开。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      # Gitee 官方 API 实现（release-sync 对已有 Release 不幂等且重建 tag 报 400）：
      # 删同 tag 旧 Release（Gitee 会级联删其自动创建的 tag）→ 建 Release（tag 不存在时按 main 自动重建）→ 上传 dist 下全部产物
      - name: Sync Release to Gitee
        if: env.HAS_GITEE_TOKEN == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_TAG: ${{ github.ref_name }}
          GITEE_SHA: ${{ github.sha }}
          GITEE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          GITEE_BODY: |
            **MoDiViEr —— MarkDown Viewer and Editor**

            | 平台 | 安装包 |
            | --- | --- |
            | Windows | `MoDiViEr_*_x64-setup.exe`（安装包）/ `MoDiViEr_*_x64_portable.exe`（便携单文件，免安装） |
            | macOS | `MoDiViEr_*.dmg`（Intel / Apple Silicon 通用） |
            | Linux | `MoDiViEr_*.deb`（Debian/Ubuntu）、`MoDiViEr-*.rpm`（Fedora/openSUSE） |

            > macOS 安装包未签名，首次打开需右键 → 打开。
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/lythu/modivier"
          get_id () { node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).id||'')}catch(e){console.log('')}})"; }

          RID=$(curl -s "$API/releases/tags/$GITEE_TAG?access_token=$GITEE_TOKEN" | get_id)
          if [ -n "$RID" ]; then
            echo "Deleting existing Gitee release $RID"
            curl -sf -X DELETE "$API/releases/$RID?access_token=$GITEE_TOKEN"
          fi

          # 确保 Gitee 侧标签存在（正常发布时应同时把 tag 推到两个远程，这里兜底；失败不阻断）
          git push "https://oauth2:$GITEE_TOKEN@gitee.com/lythu/modivier.git" "HEAD:refs/tags/$GITEE_TAG" --force \
            || echo "::warning::tag 推送到 Gitee 失败，Release 将不关联 tag"

          PAYLOAD=$(node -e "console.log(JSON.stringify({access_token:process.env.GITEE_TOKEN,tag_name:process.env.GITEE_TAG,name:'MoDiViEr '+process.env.GITEE_TAG,body:process.env.GITEE_BODY,prerelease:process.env.GITEE_PRERELEASE==='true',target_commitish:process.env.GITEE_SHA}))")
          RID=$(echo "$PAYLOAD" | curl -sf -X POST "$API/releases" -H "Content-Type: application/json" -d @- | get_id)
          [ -n "$RID" ] || { echo "Gitee release creation failed"; exit 1; }
          echo "Gitee release id: $RID"

          FAIL=0
          for f in dist/*; do
            CODE=$(curl -s -o /tmp/attach_resp.json -w "%{http_code}" -X POST "$API/releases/$RID/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@$f")
            case "$CODE" in
              2*) echo "Uploaded $(basename "$f") ($CODE)" ;;
              *)
                echo "Upload FAILED ($CODE): $(head -c 300 /tmp/attach_resp.json 2>/dev/null)"
                FAIL=1 ;;
            esac
          done
          [ "$FAIL" = "0" ] || exit 1
          echo "Gitee release synced: https://gitee.com/lythu/modivier/releases/tag/$GITEE_TAG"

      - name: Gitee sync skipped notice
        if: env.HAS_GITEE_TOKEN != 'true'
        run: echo "::warning::未配置 GITEE_TOKEN，已跳过 Gitee Release 同步。请在仓库 Settings → Secrets and variables → Actions 添加 GITEE_TOKEN（Gitee 个人令牌，需 repo 权限）后重新推送标签或重跑 Release。"
