name: Release

# 手动触发：仅执行三平台编译（用于验证流程，不发布）
# 推送 v* 标签：编译 + 发布 GitHub Release + 同步 Gitee Release
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS 通用二进制（Intel + Apple Silicon 一个安装包）+ 便携单文件
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact-name: macos-packages
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              bundles/*
          # Linux：deb + rpm + 便携单文件（在 22.04 上编译，兼容较老的 glibc）
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            artifact-name: linux-packages
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              bundles/*
          # Windows：NSIS 安装包
          - platform: windows-latest
            args: ''
            rust-targets: ''
            artifact-name: windows-packages
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              bundles/*.exe
    runs-on: ${{ matrix.settings.platform }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build -- ${{ matrix.settings.args }}

      - name: Stage portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundles | Out-Null
          $version = "${{ github.ref_name }}" -replace '^v',''
          Copy-Item "src-tauri/target/release/modivier.exe" ("bundles/modivier_{0}_x64_portable.exe" -f $version)

      # 便携单文件：无安装权限的场景直接运行（运行仍需系统 WebView 运行时，README 有说明）
      - name: Stage portable executable (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bundles
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp src-tauri/target/release/modivier "bundles/modivier_${VERSION}_linux_x64_portable"
          else
            cp src-tauri/target/universal-apple-darwin/release/modivier "bundles/modivier_${VERSION}_macos_universal_portable"
          fi
          chmod +x bundles/*_portable
          ls -la bundles/

      - name: List bundle outputs
        if: runner.os == 'Linux'
        run: ls -laR src-tauri/target/release/bundle/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.settings.artifact-name }}
          path: ${{ matrix.settings.artifact-path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # upload-artifact 会按公共祖先目录保留层级（如 dist/deb/、dist/rpm/），
      # 先摊平到 dist/ 根目录，方便 asset-files 用 dist/*.deb 等通配
      - name: Flatten and list release assets
        run: |
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -type d -empty -delete
          ls -la dist/

      # GitHub 侧用 softprops（按 tag 复用/更新 Release，重跑幂等）；
      # 第三方 release-sync 已弃用（其 GitHub 路径对已存在 Release 报 422），Gitee 同步见 scripts/sync-gitee.mjs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MoDiViEr ${{ github.ref_name }}'
          body: |
            **MoDiViEr —— MarkDown Viewer and Editor**

            | 平台 | 安装包 |
            | --- | --- |
            | Windows | `modivier_*_x64-setup.exe`（安装包）/ `modivier_*_x64_portable.exe`（便携单文件，免安装） |
            | macOS | `modivier_*.dmg`（Intel / Apple Silicon 通用）/ `modivier_*_macos_universal_portable`（便携单文件） |
            | Linux | `modivier_*.deb`（Debian/Ubuntu）、`modivier-*.rpm`（Fedora/openSUSE）/ `modivier_*_linux_x64_portable`（便携单文件，免安装） |

            > macOS 安装包未签名，首次打开需右键 → 打开。便携单文件下载后需 `chmod +x`（Linux 可直接运行；macOS 另需去除 quarantine 标记）。运行便携版仍需系统 WebView 运行时（详见 README）。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      # Gitee Release 同步已移出 CI：托管 runner（海外）到 Gitee 上传路由极慢（~60MB 实测 1h15m，见 RELEASE.md 踩坑 #9）。
      # 发版后在本机执行：node scripts/sync-gitee.mjs <tag>（国内网络到 Gitee 很快，幂等可续传）
      - name: Gitee sync moved out of CI
        run: echo "Gitee Release 请在本机同步：node scripts/sync-gitee.mjs ${{ github.ref_name }}"
